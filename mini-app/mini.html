<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Bot 管理後台</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>
    <h3>📊 群管後台</h3>

    <textarea id="text" placeholder="公告內容"></textarea>
    <br><br>
    <button onclick="send()">送出公告</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        function send() {
            fetch("/api/announce", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    chatId: tg.initDataUnsafe.chat?.id,
                    text: document.getElementById("text").value
                })
            }).then(() => {
                tg.showAlert("已送出");
            });
        }
    </script>
</body>

</html>

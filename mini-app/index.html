<!DOCTYPE html>
<html>

<body>
  <h3>Telegram Bot 控制台</h3>

  <input id="chatId" placeholder="Chat ID">
  <br><br>
  <input id="text" placeholder="訊息內容">
  <br><br>

  <button onclick="send()">送出</button>

  <script>
    function send() {
      fetch('/api/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chatId: document.getElementById('chatId').value,
          text: document.getElementById('text').value
        })
      })
        .then(r => r.json())
        .then(d => alert(JSON.stringify(d)));
    }
  </script>
</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>
    <h1>Hello Mini App</h1>
    <button onclick="send()">發公告</button>

    <script>
        function send() {
            fetch("https://sublimational-apolonia-uncompanioned.ngrok-free.dev/send", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    chatId: -100123456,
                    text: "來自 Web 面板的公告"
                })
            })
        }
    </script>
</body>

</html>
